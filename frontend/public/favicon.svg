<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="taskflowGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="128" height="128" rx="34" fill="url(#taskflowGrad)"/>

  <!-- Subtle glass highlight border -->
  <rect x="2" y="2" width="124" height="124" rx="32" stroke="white" stroke-opacity="0.25" stroke-width="3"/>

  <!-- TaskFlow Collaboration / Brain & Synergy Symbol -->
  <g transform="translate(16, 16) scale(4)" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left hemisphere -->
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" fill="white" fill-opacity="0.15"/>
    <!-- Right hemisphere -->
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" fill="white" fill-opacity="0.15"/>
    <!-- Central axis -->
    <path d="M12 5v13" stroke="white" stroke-width="2.5"/>
    <!-- Horizontal connection links -->
    <path d="M9.5 9h5"/>
    <path d="M8.5 13.5h7"/>
  </g>

  <!-- Accent sparkles -->
  <circle cx="102" cy="26" r="3.5" fill="#38BDF8"/>
  <circle cx="26" cy="102" r="2.5" fill="#C084FC"/>
</svg>
